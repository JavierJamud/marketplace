<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { margin:0; background:#f0edee; font-family:'Inter',sans-serif; } a { color:#0e1a28; text-decoration:none; } input { font-family:'Inter',sans-serif; }</style>
</helmet>

<div style="min-height:100vh;background:#f0edee;display:grid;grid-template-columns:248px 1fr;">
  <aside style="background:#001d1e;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-sizing:border-box;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;margin-bottom:6px;padding:0 8px;"><div style="width:32px;height:32px;border-radius:8px;background:#61a0a1;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;color:#001d1e;font-size:17px;">Z</div><div><div style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#fff;line-height:1;">ZeuDin</div><div style="font-size:10px;color:#61a0a1;font-weight:600;letter-spacing:0.08em;">ADMIN</div></div></a>
    <nav style="display:flex;flex-direction:column;gap:3px;flex:1;margin-top:18px;"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="6"><a href="{{ n.href }}" style="{{ n.style }}"><span dangerouslySetInnerHTML="{{ n.icon }}" style="display:inline-flex;"></span>{{ n.label }}</a></sc-for></nav>
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;padding:10px 12px;color:rgba(255,255,255,0.5);font-size:13px;font-weight:600;">Salir del panel</a>
  </aside>

  <main style="padding:30px 38px;">
    <h1 style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:25px;color:#1b1b1d;margin:0 0 4px;">Clientes</h1>
    <p style="font-size:13.5px;color:#75777c;margin:0 0 20px;">Compradores registrados. Podés ver actividad o suspender cuentas.</p>

    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #c5c6cc;border-radius:8px;padding:0 12px;height:42px;max-width:340px;margin-bottom:16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#75777c" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input placeholder="Buscar cliente..." style="border:none;outline:none;font-size:13.5px;width:100%;" />
    </div>

    <div style="background:#fff;border:1px solid #eae7e9;border-radius:16px;overflow:hidden;">
      <div style="display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr 1fr;gap:12px;padding:14px 22px;background:#f7f5f6;font-size:11.5px;font-weight:700;color:#75777c;text-transform:uppercase;letter-spacing:0.03em;"><span>Cliente</span><span>Provincia</span><span>Pedidos</span><span>Estado</span><span style="text-align:right;">Acción</span></div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr 1fr;gap:12px;padding:13px 22px;align-items:center;border-top:1px solid #f0edee;{{ r.dim }}">
          <div style="display:flex;align-items:center;gap:11px;">
            <div style="width:36px;height:36px;border-radius:9999px;background:{{ r.color }};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex-shrink:0;">{{ r.initial }}</div>
            <div><div style="font-weight:600;font-size:13.5px;color:#1b1b1d;">{{ r.name }}</div><div style="font-size:11.5px;color:#75777c;">{{ r.email }}</div></div>
          </div>
          <span style="font-size:13px;color:#44474c;">{{ r.province }}</span>
          <span style="font-size:13px;color:#44474c;">{{ r.orders }}</span>
          <span style="{{ r.stateStyle }}">{{ r.stateLabel }}</span>
          <div style="display:flex;justify-content:flex-end;"><button onClick="{{ r.toggle }}" style="{{ r.btnStyle }}">{{ r.btnLabel }}</button></div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const IC = {
  dash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  store: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M4 9h16"/></svg>',
  shield: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 8-8 11-4.5-3-8-6-8-11V5z"/></svg>',
  users: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M17 5a3 3 0 0 1 0 6M22 21c0-2.5-1.3-4.7-3.3-6"/></svg>',
  mega: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11v2a1 1 0 0 0 1 1h3l7 5V5L7 10H4a1 1 0 0 0-1 1z"/><path d="M18 8a5 5 0 0 1 0 8"/></svg>',
  plug: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6M15 2v6M7 8h10v3a5 5 0 0 1-10 0zM12 16v6"/></svg>',
};
const NAV = [
  { id: 'dash', label: 'Resumen', href: 'AdminDashboard.dc.html', icon: IC.dash },
  { id: 'vendors', label: 'Tiendas', href: 'AdminVendors.dc.html', icon: IC.store },
  { id: 'verify', label: 'Verificaciones', href: 'AdminVerifications.dc.html', icon: IC.shield },
  { id: 'customers', label: 'Clientes', href: 'AdminCustomers.dc.html', icon: IC.users },
  { id: 'campaigns', label: 'Campañas', href: 'AdminCampaigns.dc.html', icon: IC.mega },
  { id: 'integrations', label: 'Integraciones', href: 'AdminIntegrations.dc.html', icon: IC.plug },
];
const CUSTOMERS = [
  { id: 'c1', name: 'Yanet Pérez', email: 'yanet@correo.cu', province: 'La Habana', orders: 12, color: '#337475' },
  { id: 'c2', name: 'Reinier Cruz', email: 'reinier@correo.cu', province: 'La Habana', orders: 8, color: '#8A5100' },
  { id: 'c3', name: 'Dailín Gómez', email: 'dailin@correo.cu', province: 'Holguín', orders: 5, color: '#003435' },
  { id: 'c4', name: 'Osmany Ruiz', email: 'osmany@correo.cu', province: 'Santiago', orders: 3, color: '#643900' },
  { id: 'c5', name: 'Claudia Font', email: 'claudia@correo.cu', province: 'Villa Clara', orders: 9, color: '#232F3E' },
  { id: 'c6', name: 'Martín López', email: 'martin@correo.cu', province: 'Matanzas', orders: 2, color: '#2c5b2e' },
];
class Component extends DCLogic {
  state = { suspended: {} };
  renderVals() {
    const navOn = 'display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;background:#61a0a1;color:#001d1e;';
    const navOff = 'display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.7);';
    return {
      nav: NAV.map(n => ({ label: n.label, href: n.href, icon: { __html: n.icon }, style: n.id === 'customers' ? navOn : navOff })),
      rows: CUSTOMERS.map(c => {
        const sus = this.state.suspended[c.id];
        return {
          name: c.name, email: c.email, province: c.province, orders: c.orders, initial: c.name[0], color: c.color,
          dim: sus ? 'opacity:0.55;' : '',
          stateLabel: sus ? 'Suspendido' : 'Activo',
          stateStyle: sus ? 'background:rgba(186,26,26,0.12);color:#ba1a1a;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:9999px;width:fit-content;' : 'background:rgba(12,174,83,0.12);color:#0A8F42;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:9999px;width:fit-content;',
          toggle: () => this.setState(s => ({ suspended: { ...s.suspended, [c.id]: !s.suspended[c.id] } })),
          btnLabel: sus ? 'Reactivar' : 'Suspender',
          btnStyle: sus ? 'background:#0A8F42;color:#fff;border:none;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;' : 'background:none;border:1px solid #c5c6cc;color:#44474c;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;',
        };
      }),
    };
  }
}
</script>
</body>
</html>
