<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { margin:0; background:#f0edee; font-family:'Inter',sans-serif; } a { color:#0e1a28; text-decoration:none; }</style>
</helmet>

<div style="min-height:100vh;background:#f0edee;display:grid;grid-template-columns:248px 1fr;">
  <aside style="background:#0e1a28;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-sizing:border-box;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;margin-bottom:8px;padding:0 8px;"><div style="width:32px;height:32px;border-radius:8px;background:#FE9800;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;color:#0E1A28;font-size:17px;">Z</div><span style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;color:#fff;">Zeu<span style="color:#FE9800;">Din</span></span></a>
    <div style="padding:0 8px 16px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);"><div style="display:flex;align-items:center;gap:8px;margin-top:12px;"><div style="width:34px;height:34px;border-radius:9px;background:#232F3E;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;color:#fff;font-size:14px;">S</div><div><div style="display:flex;align-items:center;gap:4px;"><span style="font-weight:700;font-size:13px;color:#fff;">Sabor Criollo</span><span style="display:inline-flex;width:13px;height:13px;" dangerouslySetInnerHTML="{{ badge14 }}"></span></div><div style="font-size:11px;color:#FE9800;font-weight:600;">Restaurante · Business</div></div></div></div>
    <nav style="display:flex;flex-direction:column;gap:3px;flex:1;"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="6"><a href="{{ n.href }}" style="{{ n.style }}"><span dangerouslySetInnerHTML="{{ n.icon }}" style="display:inline-flex;"></span>{{ n.label }}</a></sc-for></nav>
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;padding:10px 12px;color:rgba(255,255,255,0.55);font-size:13px;font-weight:600;">Volver al sitio</a>
  </aside>

  <main style="padding:30px 38px;">
    <h1 style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:25px;color:#1b1b1d;margin:0 0 4px;">Pedidos</h1>
    <p style="font-size:13.5px;color:#75777c;margin:0 0 20px;">Gestioná pedidos de WhatsApp, contra entrega y de mesa (cocina).</p>

    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button></sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <sc-for list="{{ orders }}" as="o" hint-placeholder-count="5">
        <div style="background:#fff;border:1px solid #eae7e9;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
          <div style="flex:1;min-width:200px;">
            <div style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;font-size:14px;color:#1b1b1d;">{{ o.id }}</span><span style="{{ o.chanStyle }}">{{ o.channel }}</span></div>
            <div style="font-size:12.5px;color:#75777c;margin-top:3px;">{{ o.customer }} · {{ o.date }}</div>
          </div>
          <div style="font-weight:700;font-size:15px;color:#1b1b1d;">{{ o.total }}</div>
          <span style="{{ o.badgeStyle }}">{{ o.status }}</span>
          <sc-if value="{{ o.showKitchen }}">
            <div style="display:flex;gap:6px;">
              <sc-for list="{{ o.kitchenBtns }}" as="k" hint-placeholder-count="3"><button onClick="{{ k.onClick }}" style="{{ k.style }}">{{ k.label }}</button></sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const IC = {
  dash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  box: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/></svg>',
  cart: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  table: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4"/><path d="M5 8v12M19 8v12M9 8v5M15 8v5"/></svg>',
  shield: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 8-8 11-4.5-3-8-6-8-11V5z"/></svg>',
  cog: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',
};
const NAV = [
  { id: 'dash', label: 'Resumen', href: 'VendorDashboard.dc.html', icon: IC.dash },
  { id: 'products', label: 'Productos', href: 'VendorProducts.dc.html', icon: IC.box },
  { id: 'orders', label: 'Pedidos', href: 'VendorOrders.dc.html', icon: IC.cart },
  { id: 'tables', label: 'Mesas / QR', href: 'VendorTables.dc.html', icon: IC.table },
  { id: 'verify', label: 'Verificación', href: 'VendorVerification.dc.html', icon: IC.shield },
  { id: 'settings', label: 'Configuración', href: 'VendorSettings.dc.html', icon: IC.cog },
];
const KITCHEN = ['Recibido', 'Preparando', 'Listo'];
const ORDERS = [
  { id: '#Z-3120', customer: 'Mesa 4 · Reinier', date: 'Hace 5 min', channel: 'Mesa', total: 1850, kitchen: 'Preparando' },
  { id: '#Z-3119', customer: 'Mesa 2 · Dailín', date: 'Hace 12 min', channel: 'Mesa', total: 1200, kitchen: 'Recibido' },
  { id: '#Z-3118', customer: 'Yanet Pérez', date: 'Hace 20 min', channel: 'WhatsApp', total: 950, kitchen: null },
  { id: '#Z-3117', customer: 'Mesa 6 · Osmany', date: 'Hace 32 min', channel: 'Mesa', total: 2100, kitchen: 'Listo' },
  { id: '#Z-3116', customer: 'Claudia Font', date: 'Hoy 12:10', channel: 'Contra entrega', total: 700, kitchen: null },
];
class Component extends DCLogic {
  state = { badge14: '', data: null, filter: 'all', kitchen: {} };
  componentDidMount() {
    import('./badge-icon.js').then(m => this.setState({ badge14: m.verifiedBadgeSvg(14) }));
    import('./zeudin-data.js').then(m => this.setState({ data: m }));
    const k = {}; ORDERS.forEach(o => { if (o.kitchen) k[o.id] = o.kitchen; }); this.setState({ kitchen: k });
  }
  renderVals() {
    const D = this.state.data; const badge14 = { __html: this.state.badge14 };
    const navOn = 'display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;background:#FE9800;color:#0E1A28;';
    const navOff = 'display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.7);';
    const fmt = D ? D.fmtCUP : (n) => n + ' CUP';
    const sc = D ? D.statusColors : {};
    const f = this.state.filter;
    const chanColor = { 'Mesa': '#8A5100', 'WhatsApp': '#128C7E', 'Contra entrega': '#337475' };
    const filtered = ORDERS.filter(o => f === 'all' || (f === 'mesa' && o.channel === 'Mesa') || (f === 'whatsapp' && o.channel === 'WhatsApp') || (f === 'delivery' && o.channel === 'Contra entrega'));
    return {
      badge14,
      nav: NAV.map(n => ({ label: n.label, href: n.href, icon: { __html: n.icon }, style: n.id === 'orders' ? navOn : navOff })),
      filters: [{ id: 'all', label: 'Todos' }, { id: 'mesa', label: 'Mesa' }, { id: 'whatsapp', label: 'WhatsApp' }, { id: 'delivery', label: 'Contra entrega' }].map(x => ({
        label: x.label, onClick: () => this.setState({ filter: x.id }),
        style: `border:1px solid ${f === x.id ? '#232F3E' : '#c5c6cc'};background:${f === x.id ? '#232F3E' : '#fff'};color:${f === x.id ? '#fff' : '#44474c'};border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;`,
      })),
      orders: filtered.map(o => {
        const kState = this.state.kitchen[o.id];
        const isKitchen = o.channel === 'Mesa';
        const status = isKitchen ? kState : (o.channel === 'WhatsApp' ? 'Nuevo' : 'Procesando');
        return {
          id: o.id, customer: o.customer, date: o.date, channel: o.channel, total: fmt(o.total),
          chanStyle: `background:${(chanColor[o.channel] || '#75777c')}1a;color:${chanColor[o.channel] || '#75777c'};font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:9999px;`,
          status, badgeStyle: `background:${(sc[status] || '#75777c')}1f;color:${sc[status] || '#75777c'};font-weight:700;font-size:11.5px;padding:5px 12px;border-radius:9999px;`,
          showKitchen: isKitchen,
          kitchenBtns: KITCHEN.map(k => ({
            label: k, onClick: () => this.setState(s => ({ kitchen: { ...s.kitchen, [o.id]: k } })),
            style: `border:none;cursor:pointer;border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:700;${kState === k ? 'background:#0e1a28;color:#fff;' : 'background:#f0edee;color:#75777c;'}`,
          })),
        };
      }),
    };
  }
}
</script>
</body>
</html>
