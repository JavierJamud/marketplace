<!doctype html>
<html lang="es-CU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <!-- Bloque 214 (pedido explícito): favicon real de la marca, subido a
         mano en public/ (favicon.svg/favicon.ico/apple-touch-icon.png) — ya
         no el placeholder de la Auditoría 2026-08-06 (inicial "Z"/"B" sobre
         un cuadrado). Los 3 comparten el mismo fondo #1b2733 (el color real
         de apple-touch-icon.png) para verse consistentes sin importar cuál
         use cada navegador. favicon.svg manda en los navegadores modernos
         (Chrome/Firefox/Edge/Safari, todos soportan SVG); favicon.ico es el
         respaldo para el resto; apple-touch-icon.png es el ícono al
         agregar el sitio a la pantalla de inicio en iOS.
         `?v=2` (bug real reportado en vivo — "arreglé los archivos pero la
         pestaña sigue mostrando el viejo"): el favicon es lo más agresivo
         que cachea un navegador, más que el resto de la página — sobrevive
         incluso a un refresco fuerte (Ctrl+Shift+R) en pestañas que ya lo
         habían cargado antes con esta misma URL. Cambiar la URL (acá, con
         un query string) es la única forma confiable de forzar a CUALQUIER
         visitante a pedir los bytes nuevos — subí este número cada vez que
         el archivo cambie de contenido. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bloque 123 (pedido explícito — "que el estilo de la fuente de las
         letras [del nombre del preloader] tenga bordes redondeados"):
         Fredoka sumada SOLO para el nombre del preloader (ver
         #app-preloader-name más abajo) — nunca reemplaza Montserrat/Inter
         del resto del sitio (tailwind.config.js sigue intacto), es de
         terminales redondeadas de fábrica (a diferencia de Montserrat, que
         corta en ángulo recto) y combina con los trazos `stroke-linecap:
         round` que ya usa el logo del <logo-loader>. -->

    <!-- Bloque 115 (pedido explícito — "que se muestre la previsualización de
         la tienda, no la del marketplace, al compartir su link"): antes esto
         estaba vacío a propósito ("no van hardcodeadas acá para no
         duplicarlas") confiando en que vite-plugins/ogMeta.js SIEMPRE las
         inyectara — cierto en dev (Vite corre ese plugin), pero un build
         estático de producción sin un servidor que reproduzca esa inyección
         (todavía no existe, ver nota en ogMeta.js) serviría este HTML tal
         cual, sin ningún meta tag — ni siquiera la vista previa genérica del
         marketplace. Estos son el piso: SIEMPRE la vista genérica del sitio
         (nunca vacío); ogMeta.js las reemplaza (no las duplica, ver
         stripExistingMeta) cuando corre en dev y la URL es de una
         tienda/producto puntual.
         Bloque 212 (pedido explícito): "Baznova" acá es el nombre REAL de
         la plataforma (SiteSettings.siteName en la base), no "ZeuDin" —
         ZeuDin es la marca de la empresa de desarrollo de software del
         dueño, nunca el nombre de este sitio. Sigue siendo un valor fijo
         a propósito (este archivo se sirve tal cual, sin poder consultar la
         base) — si el nombre de la plataforma cambia algún día desde
         Admin → Marca, este piso estático hay que actualizarlo a mano acá.
         Bloque 54 (pedido explícito — "dejarlo solo con el nombre de la
         empresa... y luego un | Marketplace"): formato nuevo, antes era
         "Baznova — Marketplace multivendedor de Cuba". App.jsx pisa este
         título apenas React monta y /settings responde con el nombre real
         (ver usePageTitle ahí) — esto es solo el piso del primer instante. -->
    <title>Baznova | Marketplace</title>
    <meta
      name="description"
      content="Comprá y vendé en toda Cuba: tiendas verificadas, productos y restaurantes con pedido directo por WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baznova" />
    <meta property="og:title" content="Baznova — Marketplace multivendedor de Cuba" />
    <meta
      property="og:description"
      content="Comprá y vendé en toda Cuba: tiendas verificadas, productos y restaurantes con pedido directo por WhatsApp."
    />
    <meta property="og:image" content="/og-placeholder.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baznova — Marketplace multivendedor de Cuba" />
    <meta
      name="twitter:description"
      content="Comprá y vendé en toda Cuba: tiendas verificadas, productos y restaurantes con pedido directo por WhatsApp."
    />
    <meta name="twitter:image" content="/og-placeholder.png" />
    <!-- Bloque 125 (pedido explícito — reemplaza los Bloques 121-124 de
         raíz): "convertido a paths (una <path> por letra)... animación CSS
         de 'stroke draw-on': cada letra dibujada como escritura a mano,
         fill:none, stroke blanco, stroke-linecap/linejoin:round,
         pathLength='1', stroke-dashoffset de 1 a 0... al terminar el trazo,
         aparece el relleno con una transición de opacidad". Ya NO es CSS
         puro sobre texto (los bloques anteriores animaban `color`/
         `clip-path` sobre <span> de HTML) — el nombre real es dinámico
         (se elige desde el admin, nunca un texto fijo), así que hace falta
         convertir CADA letra a su contorno vectorial real en tiempo de
         carga: `opentype.min.js` (build UMD de la librería open-source
         "opentype.js" — https://github.com/opentype/opentype.js, MIT,
         copiado tal cual a public/, nunca vía CDN externo — mismo criterio
         que logo-loader.js: público, auto-hosteado, cero dependencia de
         terceros en tiempo de ejecución) parsea `public/fonts/Fredoka.ttf`
         (la fuente variable real de Fredoka, bajada del repo oficial
         google/fonts, licencia OFL — el mismo look redondeado ya elegido
         en el Bloque 123, pero ahora como CONTORNO VECTORIAL real, no solo
         como font-family de texto) y genera un `<path>` real por carácter
         (`font.getPath()` + `toPathData()`) — ver el script de abajo,
         `buildNameSVG()`. Se arma el SVG completo recién cuando la fuente
         YA cargó y el nombre YA se conoce (nunca antes — si /settings no
         responde a tiempo, ver Bloque 212, se queda sin nombre, solo el
         logo). Si
         `opentype.min.js` no llega a cargar (red lenta/backend caído), cae
         a texto plano sin animar — un preloader nunca debe romperse por
         esto. 2 animaciones por `<path>` (mismo `pathLength="1"` +
         `stroke-dasharray:1 1"` que ya usa logo-loader.js para dibujarse a
         sí mismo — mismo truco, ahora aplicado a letras reales en vez de al
         ícono de tiendita):
         - `preloader-letter-stroke`: `stroke-dashoffset` de 1 a 0 — dibuja
           el contorno de la letra, sin relleno (fill:none mientras dibuja).
         - `preloader-letter-fill-in`: `fill-opacity` de 0 a 1, arrancando
           justo cuando el trazo ya casi terminó — "al terminar el trazo,
           aparece el relleno".
         Bloque 221 (pedido explícito — rediseño completo de la coreografía
         de entrada, ver el comentario largo sobre `#app-preloader-lockup`
         más abajo): antes las 2 animaciones de letra corrían en loop
         infinito, sincronizadas al mismo reloj de 4.25s del logo, con un
         escalonado de 0.12s por letra y una meseta de 21%-92% antes de
         desvanecerse y reiniciar. Ahora el nombre aparece UNA sola vez,
         como parte del deslizamiento del ícono hacia la izquierda (nunca
         más en loop) — las 2 animaciones usan `forwards` (sostienen el
         último cuadro, letra dibujada y rellena, en vez de reiniciar) y un
         escalonado más chico (ver LETTER_STAGGER_S en el script de abajo)
         para que el "hormigueo" completo de nombres largos no se escape
         del presupuesto de la revelación (REVEAL_MS). -->
    <style>
      @keyframes preloader-letter-stroke {
        0% { stroke-dashoffset: 1; }
        70%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes preloader-letter-fill-in {
        0%, 40% { fill-opacity: 0; }
        100% { fill-opacity: 1; }
      }
      /* Bloque 224 (pedido explícito — bug real reportado en vivo, con
         captura: "elimina esa animación de brillo pasante... si necesita
         seguir cargando, solo se retrocede al igual como apareció hasta
         el punto inicial del logo y se repite toda la animación"): el
         brillo en loop del Bloque 221/222 se veía mal — pasaba por
         encima de TODO el contenedor (el hueco vacío alrededor del ícono
         y las letras también), no solo por el dibujo. Se saca del todo:
         ver startCycle()/resetChoreography() en el script de abajo — en
         vez de sostener una composición final con un brillo encima, si
         todavía falta cargar algo la coreografía entera (ícono +
         deslizamiento + nombre) vuelve a su punto de partida y se repite
         desde cero, tal cual se pidió. -->

      /* Bloque 134 (pedido explícito — "quiero que bloquees el zoom por
         completo de la página, así el cliente por error no perderá el
         contexto de la página"): el <meta name="viewport"> de arriba ya
         trae maximum-scale=1/user-scalable=no, pero Safari de iOS (desde
         iOS 10) lo IGNORA a propósito — es una decisión de accesibilidad
         de Apple, ningún meta tag lo puede evitar. touch-action:manipulation
         es la vía estándar que sí funciona en iOS/Android modernos: le
         dice al navegador que este elemento solo espera pan/click, nunca
         un doble-tap-para-zoom (el pinch-zoom de 2 dedos se bloquea aparte
         con JS, ver el <script> de más abajo, porque no hay ningún
         equivalente CSS para eso). */
      html, body {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Bloque 134 (pedido explícito — "bloquea el zoom por completo de la
         página, así el cliente por error no perderá el contexto"): va acá,
         plano, apenas arranca el <body> — antes incluso de que React exista
         — para que el bloqueo esté activo desde el primer frame, igual que
         el preloader de abajo. Cubre las 3 formas reales de hacer zoom:
         (1) pinch de 2 dedos (touchmove con más de 1 dedo, el equivalente
         universal a los eventos gesturestart/gesturechange de WebKit, que
         son propietarios de Safari/iOS); (2) doble-tap-para-zoom (ya cubierto
         por touch-action:manipulation del <style> de arriba, en navegadores
         modernos que lo respetan); (3) Ctrl+rueda del mouse en desktop (el
         atajo de zoom del navegador, WHATWG permite preventDefault() en
         "wheel" para esto). Nunca toca pan/scroll normal (1 dedo, sin Ctrl)
         — { passive:false } es obligatorio en los 2 listeners para que
         preventDefault() tenga efecto real. -->
    <script>
      (function () {
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false }
        );
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey) e.preventDefault();
          },
          { passive: false }
        );
      })();
    </script>

    <!-- Bloque 119/120 (pedido explícito — "el loader debe mostrarse hasta
         que dé toda su animación completa Y hasta que la página haya
         cargado del todo — lo que tarde más"): va ACÁ, fuera de React, a
         propósito — es la única forma real de taparle al visitante el hueco
         en blanco mientras el bundle de React todavía se está
         descargando/parseando (nunca podría hacer eso si viviera adentro de
         App.jsx, que es lo primero que este splash tiene que cubrir). Por
         eso el archivo se movió de src/assets/images/ a public/: cualquier
         cosa adentro de src/ pasa por el bundler de Vite — un <script
         type="module" src="/src/..."> lo hubiera fusionado en el mismo
         chunk que main.jsx, perdiendo justo la propiedad que hace falta acá
         (que se ejecute SOLO, de una, sin esperar a que TODO React termine
         de descargar y parsear). public/ se sirve tal cual, sin pasar por
         el bundler, en dev y en build — por eso acá es un <script> normal,
         sin type="module". -->
    <script src="/logo-loader.js"></script>
    <!-- Bloque 125: opentype.js (MIT), copia local del build UMD — ver el
         comentario largo del <style> de arriba. Tiene que cargar ANTES del
         <script> de abajo que lo usa (`window.opentype`), por eso va acá,
         en orden, no con `defer`/`async`. -->
    <script src="/opentype.min.js"></script>
    <div
      id="app-preloader"
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e1a28;transition:opacity 400ms ease;"
    >
      <!-- Bloque 221 (pedido explícito — coreografía nueva de principio a
           fin: "el ícono viene hacia el frente, centrado... al llegar a su
           punto del frente se desplazará hacia la izquierda... mientras se
           van rellenando los trazados hacia la izquierda, de esa misma vez
           van apareciendo, destapándose las letras del nombre"):
           - Esta fila (`#app-preloader-lockup`) es un flex-row con
             `justify-content:center`. El nombre arranca en `width:0`
             (ocupa 0 espacio) — con el nombre en 0, el ÚNICO contenido con
             ancho real es el ícono, así que el centrado de la fila lo deja
             centrado en toda la pantalla, tal cual se pidió ("más
             centrado"). Cuando `revealName()` (ver el script de abajo)
             anima el `width` del nombre de 0 a su ancho real, el centrado
             de la fila empuja el ícono hacia la izquierda SOLO —
             no hace falta ningún transform/translate manual en el ícono,
             el desplazamiento es un efecto secundario del layout, así que
             nunca puede desincronizarse del ancho real del nombre
             (distinto para cada sitio, el nombre es editable desde el
             admin).
           - El ícono mismo usa el atributo `once` nuevo de logo-loader.js:
             en vez del loop infinito de siempre, dibuja una sola vez
             (opaco -> rellena los trazos) y se queda quieto en el cuadro
             final, listo para deslizarse.
           Bloque 224 (pedido explícito, con captura de un mockup): el
           ícono se achica (96/76 -> 64/52) y el nombre crece (26px ->
           36px) para que los dos se vean más parejos en tamaño, en vez de
           un ícono grande dominando al lado de letras chicas — y más
           separación entre los dos (margin-left del nombre, 14px -> 20px)
           cuando se revela. Ya NO se "quedan en el DOM para siempre" si
           falta cargar algo: ver startCycle() en el script de abajo. -->
      <div id="app-preloader-lockup" style="position:relative;display:flex;align-items:center;justify-content:center;max-width:calc(100vw - 40px);">
        <logo-loader once id="app-preloader-logo" ink="#FFFFFF" accent="#FE9800" pale-ink="rgba(255,255,255,.28)" pale-accent="rgba(254,152,0,.3)" duration="3.4" size="64"></logo-loader>
        <!-- Bloque 125/221 (ver el comentario largo de arriba): arranca
             vacío (Bloque 212 — nunca "ZeuDin") y en `width:0` (Bloque 221
             — nada que revelar todavía). `buildNameSVG()` en el script de
             abajo arma acá adentro un <svg> con un <path> real por letra
             (contorno vectorial de Fredoka.ttf) recién cuando el ícono YA
             terminó su entrada Y el nombre/la fuente YA se conocen — si
             opentype.js no llega a cargar, cae a texto plano sin animar
             (envuelto en un <span>, ver renderPreloaderName, para poder
             escalarlo igual que al SVG si no entra en pantallas angostas). -->
        <div id="app-preloader-name" style="width:0;margin-left:0;overflow:hidden;white-space:nowrap;opacity:0;font-family:'Fredoka','Montserrat',sans-serif;font-weight:700;font-size:36px;letter-spacing:.02em;line-height:1.2;color:#FFFFFF;transition-property:width,margin-left,opacity;transition-timing-function:cubic-bezier(.22,.9,.3,1),cubic-bezier(.22,.9,.3,1),ease;transition-duration:.5s;"></div>
      </div>
      <!-- Bloque 49 (pedido explícito — "si pasa más de 3-5 segundos, un
           mensaje debajo del logo que vaya cambiando"): arranca invisible
           (opacity:0 en las 2 capas de abajo) — solo aparece si /settings
           sigue sin responder pasado STATUS_THRESHOLD_MS (ver el script de
           abajo). min-height evita que el resto del preloader "salte"
           verticalmente en el instante en que el mensaje aparece.
           Bloque 220 (fix de bug real reportado en vivo, con foto — "se
           superpone una palabra encima de las otras"): antes era UN solo
           <div> al que se le pisaba el textContent a mitad del fade (un
           setTimeout de 220ms tratando de adivinar cuándo terminó la
           transición CSS de opacity, nada garantiza que coincidan si el
           hilo principal está ocupado — típicamente ACÁ, mientras de fondo
           se parsea el bundle de React recién descargado). Ahora son 2
           capas (`-a`/`-b`) superpuestas con `position:absolute`, cada una
           su propio nodo de texto: solo se escribe texto en la que está
           OCULTA, nunca en la visible, así no hay forma de que dos mensajes
           se mezclen letra por letra — en el peor de los casos (hilo
           principal trabado) se ve un cross-fade más largo, nunca texto
           superpuesto/ilegible. -->
      <div
        id="app-preloader-status"
        style="position:relative;margin-top:2px;min-height:16px;line-height:16px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.62);letter-spacing:.01em;text-align:center;"
      >
        <span id="app-preloader-status-a" style="position:absolute;top:0;left:50%;display:block;max-width:min(280px,82vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-50%);transition:opacity 420ms ease;"></span>
        <span id="app-preloader-status-b" style="position:absolute;top:0;left:50%;display:block;max-width:min(280px,82vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-50%);transition:opacity 420ms ease;"></span>
      </div>
    </div>
    <script>
      // Bloque 120 (pedido explícito): el splash de arriba se apaga acá
      // mismo, en JS plano — NO desde React (ver Bloque 119, donde vivía en
      // un componente montado por App.jsx: el reloj arrancaba recién cuando
      // React montaba, que ya es tarde — el SVG de arriba empieza a
      // animarse ANTES de eso, apenas se inserta en el DOM). Se apaga solo
      // cuando se cumplen TODAS estas cosas, lo que tarde más: (1) la
      // coreografía de entrada terminó (ver Bloque 221 más abajo); (2) la
      // página terminó de cargar de verdad — `window.load` (no
      // DOMContentLoaded: ese dispara con el HTML parseado nomás, antes de
      // que las imágenes/el bundle de React terminen de bajar — `load` es
      // la señal real del navegador de "esta página ya cargó por
      // completo").
      (function () {
        var pageLoaded = document.readyState === "complete";

        // Bloque 126 (pedido explícito — "quiero que el loader el logo se
        // vea más responsivo y pequeño en dispositivos móviles"): el
        // tamaño del <logo-loader> lo controla el atributo `size` (ver
        // public/logo-loader.js) y no CSS —no hay una vía CSS pura para
        // achicarlo en pantallas angostas—, así que se ajusta acá con JS,
        // reactivo a resize (por si el usuario gira el teléfono o achica la
        // ventana del navegador).
        function currentIconSize() {
          // Bloque 131 (pedido explícito — "en pantallas grandes se ve un
          // poco muy grande, un poquito menos, no tanto"): 140 -> 118, una
          // reducción moderada a propósito (~16%), no drástica — el pedido
          // fue específico en que no quería un cambio grande. El tamaño de
          // 92 en móvil (Bloque 126) no se tocó, no fue parte de ese pedido.
          // Bloque 221: factorizado a función (antes vivía solo adentro de
          // applyResponsiveLogoSize) porque fitNameToViewport() de abajo
          // también necesita saber cuánto mide el ícono para calcular
          // cuánto espacio horizontal le queda libre al nombre.
          // Bloque 222 (pedido explícito — "el icono del loader más
          // pequeño"): 118 -> 96 y 92 -> 76.
          // Bloque 224 (pedido explícito, con captura de un mockup —
          // "el logo es mas pequeño y el nombre mas semejante al tamaño
          // del logo"): 96 -> 64 y 76 -> 52, junto con FONT_SIZE subiendo
          // de 26 a 36 más abajo — ícono y nombre quedan en una
          // proporción mucho más pareja que antes (antes el ícono
          // dominaba, casi 4x la altura de la letra).
          return window.innerWidth <= 480 ? 52 : 64;
        }
        var logoEl = document.querySelector("#app-preloader logo-loader");
        function applyResponsiveLogoSize() {
          if (!logoEl) return;
          logoEl.setAttribute("size", String(currentIconSize()));
        }
        applyResponsiveLogoSize();
        window.addEventListener("resize", applyResponsiveLogoSize);

        // Bloque 125 (pedido explícito): mismos 2 colores exactos del
        // <logo-loader> de arriba — "siempre utilizará los colores que
        // tiene el loader", nunca una paleta propia para el nombre. La
        // primera letra siempre ACCENT (naranja), el resto siempre INK
        // (blanco) — sin importar cuál sea el nombre real.
        var INK = "#FFFFFF";
        var ACCENT = "#FE9800";
        // Bloque 221: antes 0.12s — ese valor asumía un loop de 4.25s con
        // de sobra para que hasta el "hormigueo" de un nombre largo
        // terminara. Ahora el nombre se dibuja UNA sola vez, sincronizado
        // con el deslizamiento del ícono (REVEAL_MS más abajo) — con 0.12s
        // por letra, un nombre de 8+ letras tardaría casi 1s solo en
        // arrancar la última, mucho más que el resto de la coreografía.
        // Bloque 222 (pedido explícito — "más lenta... se vea más suave,
        // no tan rápido"): 0.035 -> 0.045, subido junto con LETTER_ANIM_S
        // de abajo — mismo "hormigueo" visual, un poco más pausado.
        // Bloque 225 (pedido explícito — "se ve un poco apresurada y
        // rápida... así se puede distinguir bien toda la animación"):
        // 0.045 -> 0.06, junto con el resto de la coreografía (ver
        // ICON_DURATION_MS más abajo) alargándose en la misma proporción.
        var LETTER_STAGGER_S = 0.06;
        // Cuánto tarda CADA letra en dibujarse + rellenarse (antes, en el
        // loop, esto salía implícito de puntos fijos del 4.25s — acá es un
        // valor propio porque revealName() necesita calcular la duración
        // total del "hormigueo" para sincronizar con ella el ancho que se
        // va revelando (ver REVEAL_MS/computeRevealSeconds más abajo).
        // Bloque 222: 0.45 -> 0.6. Bloque 225: 0.6 -> 0.85, mismo pedido
        // de que se note cada paso en vez de sentirse apurado.
        var LETTER_ANIM_S = 0.85;
        // Bloque 221 (pedido explícito — "el ícono grande al lado del
        // nombre"): en el stack vertical de antes, 22px alcanzaba al lado
        // de un ícono de ~140px.
        // Bloque 224 (pedido explícito, con captura de un mockup — "el
        // nombre mas semejante al tamaño del logo"): 26 -> 36, junto con
        // el ícono achicándose (ver currentIconSize arriba) — quedan en
        // una proporción pareja, ninguno domina al otro. STROKE_WIDTH
        // sube en la misma proporción (26->36 es *1.38, 3*1.38≈4) para
        // que el trazo de la letra no se vea desproporcionadamente fino
        // al lado del nuevo tamaño.
        var FONT_SIZE = 36;
        var STROKE_WIDTH = 4;

        var loadedFont = null;
        // fontSettled: true una vez que opentype.js terminó de intentar
        // cargar Fredoka.ttf (con éxito o sin él) — o de una si
        // window.opentype ni siquiera existe (nunca va a cargar). Junto con
        // resolvedName (más abajo), evita el flash de "ZeuDin" seguido del
        // nombre real: no se pinta NADA hasta saber las dos cosas a la vez
        // (pedido explícito del usuario — "no debería poner ZeuDin al
        // principio y luego flashear rápido y poner el nombre real").
        var fontSettled = !window.opentype;
        var resolvedName = null;

        function escapeHtml(s) {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Arma el <svg> real — un <path> por letra (contorno vectorial de
        // Fredoka.ttf vía opentype.js), cada uno con pathLength="1" y las
        // 2 animaciones (`preloader-letter-stroke` dibuja el trazo,
        // `preloader-letter-fill-in` aparece el relleno al terminar) —
        // ver el <style> de arriba para el porqué completo. Los espacios
        // (nombres de 2+ palabras) no generan <path> — no tienen contorno,
        // solo avanzan el cursor — pero SÍ cuentan como una letra más para
        // el escalonado, para que el ritmo del "hormigueo" no se acelere
        // después de un espacio. Bloque 221: `forwards` en vez de
        // `infinite` — cada letra dibuja una sola vez y se queda rellena
        // (ver el <style> de arriba, las 2 keyframes ya no tienen cola de
        // reinicio).
        function buildNameSVG(font, name) {
          var ascent = (font.ascender / font.unitsPerEm) * FONT_SIZE;
          var descent = (Math.abs(font.descender) / font.unitsPerEm) * FONT_SIZE;
          var height = ascent + descent;
          var x = 0;
          var paths = "";
          for (var i = 0; i < name.length; i++) {
            var ch = name.charAt(i);
            var advance = font.getAdvanceWidth(ch, FONT_SIZE);
            if (ch !== " ") {
              var d = font.getPath(ch, x, ascent, FONT_SIZE).toPathData(2);
              var color = i === 0 ? ACCENT : INK;
              var delay = (i * LETTER_STAGGER_S).toFixed(2);
              paths +=
                '<path pathLength="1" d="' + d + '" fill="' + color + '" stroke="' + color + '" ' +
                'stroke-width="' + STROKE_WIDTH + '" stroke-linecap="round" stroke-linejoin="round" ' +
                'style="fill-opacity:0;stroke-dasharray:1 1;stroke-dashoffset:1;' +
                "animation:preloader-letter-stroke " + LETTER_ANIM_S + "s ease-in-out forwards,preloader-letter-fill-in " + LETTER_ANIM_S + "s ease-in-out forwards;" +
                'animation-delay:' + delay + 's;"></path>';
            }
            x += advance;
          }
          var w = Math.ceil(x);
          var h = Math.ceil(height);
          return (
            '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" ' +
            'style="display:block;overflow:visible;" role="img" aria-label="' + escapeHtml(name) + '">' + paths + "</svg>"
          );
        }

        function renderPreloaderName(name) {
          var el = document.getElementById("app-preloader-name");
          if (!el) return;
          if (loadedFont) {
            try {
              el.innerHTML = buildNameSVG(loadedFont, name);
              return;
            } catch (e) {
              // Si algo sale mal armando el SVG (nombre con un carácter que
              // la fuente no tiene, etc.), cae al texto plano de abajo —
              // un preloader nunca debe romperse por esto.
            }
          }
          // Bloque 221: envuelto en un <span>, no texto suelto — fitName-
          // ToViewport() de abajo necesita un elemento propio para poder
          // escalarlo (transform) igual que haría con el <svg>, si el
          // nombre no entra en una pantalla angosta.
          el.innerHTML = "";
          var span = document.createElement("span");
          span.style.display = "inline-block";
          span.textContent = name;
          el.appendChild(span);
        }

        // Recién intenta revelar el nombre cuando las DOS cosas ya se
        // resolvieron: el nombre real (fetch de abajo) Y si la fuente
        // cargó o no (arriba). Nunca pinta directo acá — Bloque 221/224:
        // tryReveal() (más abajo) decide SI y CUÁNDO, según en qué punto
        // de la coreografía (o de qué vuelta/ciclo) está el ícono. Esto
        // evita que el nombre aparezca antes de tiempo (ej. si /settings
        // responde mientras el ícono todavía está llegando) — nunca
        // "ZeuDin" como placeholder, y tampoco el nombre real fuera de
        // compás. `cycleToken` (declarado más abajo) identifica de qué
        // vuelta de la animación es este intento — si para cuando esto se
        // llama ya se reinició un ciclo nuevo, tryReveal() lo ignora solo.
        function renderIfReady() {
          if (resolvedName === null || !fontSettled) return;
          tryReveal(cycleToken);
        }

        // Bloque 125: opentype.js parsea la fuente real UNA sola vez. Si
        // opentype.min.js no cargó (script bloqueado/red lenta), `opentype`
        // no existe (fontSettled ya arrancó en true) — se queda con el
        // texto plano sin animar.
        if (window.opentype) {
          opentype.load("/fonts/Fredoka.ttf", function (err, font) {
            if (!err && font) loadedFont = font;
            fontSettled = true;
            renderIfReady();
          });
        }

        // Bloque 182 (bug real reportado en vivo — "no me carga el backend
        // cuando cambio de red o no tengo internet"): antes usaba el
        // reemplazo de variables de entorno de Vite en el HTML, apuntando a
        // una IP de LAN fija — rota en cualquier otra red.
        // Bloque 46 (bug real reportado en vivo, en producción — "cuando me
        // carga el loader no me pone debajo el nombre del negocio"): el
        // fetch de acá SIEMPRE apuntaba a `window.location.hostname:4000`,
        // asumiendo que el backend vive en el MISMO host que el frontend,
        // solo que en otro puerto — cierto en dev (los dos corren en
        // localhost), pero falso apenas front y back quedan en dominios
        // DISTINTOS de verdad (ej. Render: zeudin-frontend.onrender.com
        // sirviendo el HTML, zeudin-backend.onrender.com el API) — el fetch
        // pegaba contra un host que ni siquiera existe, fallaba siempre en
        // silencio, y el nombre nunca se pintaba. `%VITE_API_URL%` es la
        // sintaxis de Vite para inyectar una env var directo en el HTML en
        // build time (mismo valor que ya usa lib/api.js vía
        // import.meta.env, ver el comentario ahí) — funciona porque este
        // reemplazo lo hace Vite ANTES de servir el archivo, no en runtime,
        // así que un <script> plano (sin import.meta.env real) igual lo
        // recibe ya resuelto. Sin esa variable seteada (dev normal, o el
        // caso donde front/back sí comparten host), Vite deja el string
        // vacío — ahí se sigue usando el mismo heurístico de siempre
        // (mismo host, puerto 4000) como corresponde en ese escenario.
        // Bloque 212 (pedido explícito, bug real reportado en vivo con
        // captura — "cuando el backend falla sale el nombre ZeuDin... eso
        // no debe ser así, ZeuDin es la marca de mi empresa de desarrollo de
        // software, no el nombre de esta plataforma"): si /settings todavía
        // no respondió, el fallback nunca es un nombre de marca ajeno — es
        // string vacío, que renderPreloaderName()/buildNameSVG() ya
        // interpretan como "no hay nada que dibujar" (0 letras, el <svg>
        // queda con ancho 0), así que solo se ve el logo solo, animando.
        var API_BASE = "%VITE_API_URL%";
        if (!API_BASE || API_BASE.indexOf("%") === 0) {
          API_BASE = "http://" + window.location.hostname + ":4000";
        }

        // Bloque 49 (bug real reportado en vivo, en Render con el plan
        // gratuito — "cuando el backend se duerme, se ve el logo sin
        // nombre... y ABRE la página sin ningún dato de la base, solo el
        // frontend vacío"): antes /settings era "mejor esfuerzo" (Bloque
        // 212) — si fallaba, se resolvía con nombre vacío Y de todas formas
        // dejaba que el preloader se apagara igual (maybeHide() solo
        // dependía de pageLoaded, nunca de esto). El problema real: el
        // frontend es un Static Site (carga al toque, sin cold start), pero
        // el backend es un Web Service aparte que SÍ se suspende sin
        // actividad — `window.load` (assets estáticos) no tiene ninguna
        // relación con si el backend ya despertó. Ahora /settings es la
        // señal real de "el backend está despierto y devolviendo datos de
        // la base" — mientras no responda con éxito, se reintenta solo cada
        // SETTINGS_RETRY_MS (cold start de Render gratis: puede tardar
        // 30-60s+), y el preloader NUNCA se apaga hasta que se resuelva —
        // "se quedará siempre cargando en el logo" tal cual se pidió. Pasado
        // STATUS_THRESHOLD_MS sin respuesta, aparece un mensaje debajo del
        // nombre que va rotando cada STATUS_ROTATE_MS (pedido explícito:
        // "cargando tiendas... organizando los mejores negocios...").
        var settingsLoaded = false;
        var SETTINGS_RETRY_MS = 2500;
        var STATUS_THRESHOLD_MS = 3500;
        var STATUS_ROTATE_MS = 2600;
        var STATUS_MESSAGES = [
          "Cargando tiendas...",
          "Organizando los mejores negocios...",
          "Recopilando la mejor información para mostrarte...",
          "Preparando tu catálogo de productos...",
          "Ya casi está listo...",
        ];
        var statusTimer = null;

        // Bloque 220: cross-fade entre 2 capas en vez de pisar el texto de
        // una sola (ver el comentario largo sobre el <div> de arriba para
        // el porqué). `active` indica cuál de las 2 está visible — el
        // mensaje siguiente se escribe en la OTRA (oculta) antes de
        // mostrarla, nunca se toca el textContent de la que está a la vista.
        function showStatusMessages() {
          var layers = [document.getElementById("app-preloader-status-a"), document.getElementById("app-preloader-status-b")];
          if (!layers[0] || !layers[1] || statusTimer || settingsLoaded) return;
          var active = 0;
          var i = 0;
          layers[active].textContent = STATUS_MESSAGES[i];
          layers[active].style.opacity = "1";
          statusTimer = setInterval(function () {
            i = (i + 1) % STATUS_MESSAGES.length;
            var next = active === 0 ? 1 : 0;
            layers[next].textContent = STATUS_MESSAGES[i];
            layers[next].style.opacity = "1";
            layers[active].style.opacity = "0";
            active = next;
          }, STATUS_ROTATE_MS);
        }
        setTimeout(showStatusMessages, STATUS_THRESHOLD_MS);

        // Bloque 221/224 — máquina de estados de la coreografía completa,
        // en ciclos que se repiten mientras haga falta:
        //   1. startCycle() arranca un ciclo nuevo: resetChoreography()
        //      vuelve el nombre a width:0/opacity:0 y reinicia desde cero
        //      la animación del ícono (logo-loader.restart(), ver
        //      public/logo-loader.js) — "se retrocede al igual como
        //      apareció, hasta el punto inicial del logo", tal cual se
        //      pidió.
        //   2. A mitad de la animación del ícono (SLIDE_TRIGGER_MS — NO
        //      se espera a que termine), tryReveal() revela el nombre si
        //      ya se conoce (nombre + fuente listos): el deslizamiento y
        //      el dibujado de las letras corren superpuestos con el resto
        //      del dibujado del ícono, no después.
        //   3. Al terminar el ciclo completo (ICON_DURATION_MS): si la
        //      página y el nombre ya están listos, se oculta todo. Si no,
        //      vuelve al paso 1 — "si necesita seguir cargando... se
        //      repite toda la animación", en vez del brillo en loop de
        //      antes (Bloque 221/222, sacado del todo — bug real
        //      reportado en vivo, con captura: se veía mal, pasaba por
        //      encima de TODO el contenedor en vez de solo el dibujo).
        // `cycleToken` identifica de qué vuelta es cada timer pendiente —
        // si alguna vez se solaparan 2 ciclos, los timers del viejo se
        // reconocen como obsoletos (token !== cycleToken) y no hacen nada.
        // Bloque 225 (pedido explícito — "se ve un poco apresurada y
        // rápida... quiero que sea un poco más suave, así se puede
        // distinguir bien toda la animación"): 2400 -> 3400 (+42%, misma
        // proporción que LETTER_ANIM_S/LETTER_STAGGER_S de arriba) — más
        // tiempo para que el ojo siga cada paso (llega, rellena, desliza,
        // destapa el nombre) en vez de sentirlos todos encimados.
        var ICON_DURATION_MS = 3400; // debe coincidir con duration="3.4" de arriba
        // Bloque 226 (pedido explícito — "la animación del logo en cuanto
        // aparece debe moverse hacia la izquierda con la animación de las
        // letras en el mismo tiempo"): 0.22 -> 0.12 — antes se esperaba a
        // que el ícono ya estuviera rellenando los trazos (16.5%+) para
        // recién arrancar el deslizamiento; ahora arranca apenas el ícono
        // TERMINA de aparecer (enterOnce llega a opacity:1 en el 9%, ver
        // public/logo-loader.js) — el deslizamiento y el dibujado de las
        // letras corren junto con el relleno de los trazos desde el
        // principio, no después.
        var SLIDE_TRIGGER_MS = Math.round(ICON_DURATION_MS * 0.12); // ~0.41s
        var cycleToken = 0;
        var nameRevealedThisCycle = false;

        // Calcula cuánto espacio horizontal le queda libre al nombre (todo
        // el ancho de la ventana, menos el ícono, menos el margen entre
        // los dos, menos un respiro de los bordes) y, si el nombre real no
        // entra ahí (nombres largos en pantallas angostas — R-03, nunca
        // desbordar horizontal), lo escala hacia abajo con `transform`
        // (no cambia el layout, así que el <div> contenedor puede seguir
        // animando su `width` al valor ya escalado sin perder el recorte).
        // Bloque 226 (pedido explícito — "el logo y el nombre... deben
        // estar más pegados, no debe existir tanta separación en el
        // centro"): 20 -> 10.
        var NAME_MARGIN_PX = 10;
        var NAME_SAFE_EDGE_PX = 20;
        function fitNameToViewport(nameEl) {
          var child = nameEl.firstElementChild;
          if (!child) return 0;
          var naturalWidth = child.scrollWidth;
          var available = Math.max(40, window.innerWidth - currentIconSize() - NAME_MARGIN_PX - NAME_SAFE_EDGE_PX * 2);
          if (naturalWidth > available) {
            child.style.transformOrigin = "left center";
            child.style.transform = "scale(" + (available / naturalWidth).toFixed(4) + ")";
            return Math.ceil(available);
          }
          return Math.ceil(naturalWidth);
        }

        // La revelación (ancho + hormigueo de letras) dura lo mismo que
        // tardan las letras en dibujarse — así el deslizamiento del ícono
        // y el "destapado" del nombre siempre terminan juntos, sea cual
        // sea el largo del nombre real (lo decide el admin, nunca es fijo).
        // Bloque 225: piso y techo subieron en la misma proporción que
        // LETTER_ANIM_S/LETTER_STAGGER_S (0.6-1.6s -> 0.85-2.3s).
        function computeRevealSeconds(name) {
          var letters = name.replace(/ /g, "").length;
          if (letters === 0) return 0;
          var seconds = (letters - 1) * LETTER_STAGGER_S + LETTER_ANIM_S;
          return Math.min(2.3, Math.max(0.85, seconds));
        }

        // Bloque 224: vuelve el nombre a su estado de arranque SIN animar
        // (transition-duration:0s — un reset tiene que ser instantáneo,
        // nunca una transición visible) y reinicia el dibujado del ícono
        // desde cero. Esto es el "punto inicial del logo" al que se pidió
        // volver antes de repetir toda la animación.
        function resetChoreography() {
          nameRevealedThisCycle = false;
          var nameEl = document.getElementById("app-preloader-name");
          if (nameEl) {
            nameEl.style.transitionDuration = "0s";
            nameEl.style.width = "0px";
            nameEl.style.marginLeft = "0px";
            nameEl.style.opacity = "0";
            nameEl.innerHTML = "";
          }
          var icon = document.getElementById("app-preloader-logo");
          if (icon && typeof icon.restart === "function") icon.restart();
        }

        function revealName(token) {
          if (token !== cycleToken || nameRevealedThisCycle) return;
          nameRevealedThisCycle = true;
          if (!resolvedName) return; // nombre vacío (Bloque 212): el ícono se queda solo, nada que revelar
          renderPreloaderName(resolvedName);
          var nameEl = document.getElementById("app-preloader-name");
          if (!nameEl) return;
          var revealSeconds = computeRevealSeconds(resolvedName);
          var targetWidth = fitNameToViewport(nameEl);
          nameEl.style.transitionDuration = revealSeconds + "s";
          // Fuerza un reflow entre fijar el estado inicial y el final —
          // si el navegador colapsa ambos cambios en el mismo frame, el
          // ancho salta de una sola vez en vez de animar.
          void nameEl.offsetWidth;
          nameEl.style.width = targetWidth + "px";
          nameEl.style.marginLeft = NAME_MARGIN_PX + "px";
          nameEl.style.opacity = "1";
        }

        // Llamado tanto desde el timer de SLIDE_TRIGGER_MS de este ciclo
        // como desde renderIfReady() en cuanto el nombre/la fuente
        // resuelven — lo que pase primero. `token` descarta el intento
        // solo si para entonces ya se reinició un ciclo nuevo.
        function tryReveal(token) {
          if (token !== cycleToken || nameRevealedThisCycle) return;
          if (resolvedName === null || !fontSettled) return;
          revealName(token);
        }

        function startCycle() {
          var token = ++cycleToken;
          resetChoreography();
          setTimeout(function () {
            tryReveal(token);
          }, SLIDE_TRIGGER_MS);
          setTimeout(function () {
            if (token !== cycleToken) return;
            if (pageLoaded && settingsLoaded && nameRevealedThisCycle) {
              hidePreloader();
            } else {
              startCycle(); // sigue cargando -> vuelve al punto inicial y repite
            }
          }, ICON_DURATION_MS);
        }
        startCycle();

        function fetchSettings() {
          fetch(API_BASE + "/settings")
            .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error("bad status")); })
            .then(function (data) {
              var name = data && data.settings && data.settings.siteName;
              resolvedName = name || "";
              settingsLoaded = true;
              renderIfReady();
            })
            .catch(function () {
              setTimeout(fetchSettings, SETTINGS_RETRY_MS);
            });
        }
        fetchSettings();

        function hidePreloader() {
          var el = document.getElementById("app-preloader");
          if (!el) return;
          if (statusTimer) {
            clearInterval(statusTimer);
            statusTimer = null;
          }
          el.style.opacity = "0";
          el.style.pointerEvents = "none";
          setTimeout(function () {
            el.remove();
          }, 400);
        }

        if (!pageLoaded) {
          window.addEventListener("load", function () {
            pageLoaded = true;
          });
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
